<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Link Tamu - Bernaung Invitation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-shadow/5.15.4/css/all.min.css">
    <style>
        :root {
            --color-gold: #c5a880;
            --color-dark: #111111;
            --color-dark-grey: #1a1a1a;
            --color-light: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-dark);
            color: var(--color-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--color-dark-grey);
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .logo {
            text-align: center;
            font-size: 1.1em;
            letter-spacing: 2px;
            color: var(--color-gold);
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.4em;
            color: var(--color-light);
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: #b3b3b3;
        }

        input[type="text"], input[type="tel"], textarea {
            width: 100%;
            padding: 12px;
            background-color: #0b0b0b;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--color-gold);
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--color-gold);
            color: var(--color-dark);
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #b3956b;
        }

        button:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #333;
            display: none;
        }

        .result-box.active {
            display: block;
        }

        .output-link {
            background-color: #0b0b0b;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #222;
            font-size: 0.85em;
            word-break: break-all;
            margin-bottom: 15px;
            color: var(--color-gold);
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            text-align: center;
            display: block;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95em;
            transition: background 0.3s;
        }

        .btn-whatsapp:hover {
            background-color: #20ba5a;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75em;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">Bernaung Invitation</div>
    <h2>Tamu Link Generator</h2>

    <div class="form-group">
        <label for="namaTamu">Nama Tamu</label>
        <input type="text" id="namaTamu" placeholder="Contoh: Bapak Latif & Istri">
    </div>

    <button onclick="generateLink()">Buat Link Undangan</button>

    <div class="result-box" id="resultBox">
        <label>Link Undangan Hasil Generate:</label>
        <div class="output-link" id="outputLink"></div>
        
        <a href="#" target="_blank" class="btn-whatsapp" id="btnWaSender">
            <i class="fab fa-whatsapp"></i> Kirim Via WhatsApp
        </a>
    </div>

    <div class="footer">
        &copy; 2026 Bernaung Invitation. All Rights Reserved.
    </div>
</div>

<script>
function generateLink() {
    const nama = document.getElementById('namaTamu').value.trim();
    let hp = document.getElementById('nomorHp').value.trim();

    if (!nama) {
        alert("Mohon masukkan nama tamu terlebih dahulu!");
        return;
    }

    // Otomatis mengambil base URL folder tempat file tamu.html berada
    const baseURL = window.location.href.replace('tamu.html', 'index.html');
    
    // Format nama ke dalam bentuk link URL (?to=Nama+Tamu)
    const urlUndangan = baseURL + '?to=' + encodeURIComponent(nama);

    // Format susunan teks WhatsApp persis seperti permintaan kamu
    const pesanWa = "Kepada Yth.\n" +
                    "Bapak/Ibu/Saudara/i\n" +
                    "*" + nama + "*\n" + 
                    "_______\n\n" +
                    "Assalamualaikum Warahmatullahi Wabarakatuh\n\n" +
                    "Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i, teman sekaligus sahabat, untuk menghadiri acara pernikahan kami.\n\n" +
                    urlUndangan + "\n\n" +
                    "NB: Hasil maksimal buka lewat browser chrome/safari\n\n" +
                    "Merupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan untuk hadir dan memberikan doa restu.\n\n" +
                    "Wassalamualaikum Warahmatullahi Wabarakatuh\n\n" +
                    "Terima Kasih\n\n" +
                    "Hormat kami,\n" +
                    "Vira dan Didik\n" + 
                    "________\n\n" +
                    "Mohon maaf jika ada kesalahan penulisan nama atau gelar";

    // Format nomor HP ke standar internasional (62)
    if (hp) {
        if (hp.startsWith('0')) {
            hp = '62' + hp.slice(1);
        } else if (hp.startsWith('+62')) {
            hp = hp.replace('+', '');
        }
    }

    // Tampilkan hasil link undangan saja di kotak output halaman web
    document.getElementById('outputLink').innerText = urlUndangan;
    
    // Bungkus teks ke link tombol kirim WhatsApp api
    const waLink = `https://api.whatsapp.com/send?phone=${hp}&text=${encodeURIComponent(pesanWa)}`;
    document.getElementById('btnWaSender').href = waLink;

    document.getElementById('resultBox').classList.add('active');
}
</script>

</body>
</html>
