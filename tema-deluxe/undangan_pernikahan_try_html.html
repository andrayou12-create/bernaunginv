<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO & META TAGS FOR SHARING -->
    <title>Wedding - Vira & Didik</title>
    <meta name="description" content="Undangan Pernikahan Vira & Didik - 26 Juni 2026. Jadikan acara kami lebih berkesan dengan kehadiran Anda." />
    
    <!-- Favicon -->
    <link rel="icon" href="https://the.invisimple.id/wp-content/uploads/2024/05/icon-invitaja-150x150.png" type="image/png">
    
    <!-- OpenGraph (Social Media Sharing) -->
    <meta property="og:title" content="The Wedding of Vira & Didik" />
    <meta property="og:description" content="Kami mengundang Bapak/Ibu/Saudara/i untuk hadir dalam acara pernikahan kami." />
    <meta property="og:image" content="https://bernaunginv.my.id/tema-deluxe/images/Cover.jpg" />
    <meta property="og:url" content="https://andrayou12-create.github.io/bernaungid/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wedding Invitation" />

    <!-- Fonts: Poppins & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons & Tailwind -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --font-main: 'Poppins', sans-serif;
            --font-sub: 'Montserrat', sans-serif;
            --color-primary: #FFFFFF;
            --color-bg: #101010;
        }

        body {
            background-color: var(--color-bg);
            color: #DDDDDD;
            font-family: var(--font-main);
            overflow-x: hidden;
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .font-main { font-family: var(--font-main); }
        .font-sub { font-family: var(--font-sub); font-weight: 500; } 
        .font-accent { font-family: var(--font-main); font-weight: 800; } 
        .text-content { font-family: var(--font-main); font-weight: 400; } 
        
        #bg-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -2; }
        .video-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.4); z-index: -1; }

        .app-container { max-width: 500px; margin: 0 auto; background: transparent; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.7); position: relative; z-index: 10; }

        #cover { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.9)), url('https://bernaunginv.my.id/tema-deluxe/images/Cover.jpg') center/cover; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }

        .btn-primary { background-color: rgba(0, 0, 0, 0.5); color: #fff; padding: 12px 28px; border-radius: 30px; font-size: 0.85rem; font-family: var(--font-main); font-weight: 600; border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(5px); display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: all 0.3s ease; text-decoration: none; }
        .btn-primary:hover { background-color: var(--color-primary); border-color: var(--color-primary); color: #000; transform: scale(0.95); }

        .inv-fade-in { opacity: 0; transition: opacity 1.5s ease-in-out; }
        .inv-fade-in.active { opacity: 1; }
        .inv-atas { transform: translateY(50px); opacity: 0; transition: transform 1.5s ease, opacity 1.5s ease; }
        .inv-atas.active { transform: translateY(0); opacity: 1; }
        .inv-zoom-in { transform: scale(0.9); opacity: 0; filter: blur(3px); transition: transform 1.5s ease, opacity 1.5s ease, filter 1.5s ease; }
        .inv-zoom-in.active { transform: scale(1); opacity: 1; filter: blur(0); }
        .inv-zoom-out { transform: scale(1.1); opacity: 0; filter: blur(3px); transition: transform 1.5s ease, opacity 1.5s ease, filter 1.5s ease; }
        .inv-zoom-out.active { transform: scale(1); opacity: 1; filter: blur(0); }

        .wds-divider { width: 80%; height: 1px; background: rgba(255,255,255,0.2); margin: 30px auto; position: relative; }
        .timeline-container { position: relative; }
        .timeline-item { margin-bottom: 30px; position: relative; text-align: center; }
        .bg-slider { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .bg-slider img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; animation: fadeSlide 15s infinite; }
        .bg-slider img:nth-child(1) { animation-delay: 0s; }
        .bg-slider img:nth-child(2) { animation-delay: 5s; }
        .bg-slider img:nth-child(3) { animation-delay: 10s; }
        
        @keyframes fadeSlide { 0% { opacity: 0; transform: scale(1.05); } 10% { opacity: 1; transform: scale(1.03); } 33% { opacity: 1; transform: scale(1); } 43% { opacity: 0; transform: scale(0.98); } 100% { opacity: 0; transform: scale(0.98); } }

        #daftar-ucapan-spreadsheet { list-style: none; padding: 0; margin: 20px 0; max-height: 400px; overflow-y: auto; }
        .kartu-ucapan { background: rgba(255,255,255,0.05); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; margin-bottom: 10px; color: #fff; }
        .form-input { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; background: rgba(0,0,0,0.6); color: #fff; margin-bottom: 15px; }
        .rotating { animation: rotating 8s linear infinite; }
        @keyframes rotating { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .locked { overflow: hidden; height: 100vh; }
        .glass-panel { background: rgba(0, 0, 0, 0.15); backdrop-filter: blur(6px); }
    </style>
</head>
<body class="locked">

    <!-- Konten Undangan Anda di Sini (Sama seperti sebelumnya) -->
    <div id="cover">
        <h2 class="text-sm font-sub tracking-[0.2em] uppercase inv-atas">The Wedding Of</h2>
        <h1 class="text-3xl md:text-4xl font-main my-3 text-white inv-zoom-in">Vira & Didik</h1>
        <button class="btn-primary inv-atas" id="btn_open">Buka Undangan</button>
    </div>

    <!-- Tambahkan sisa konten Anda di sini -->

    <script>
        // Copy paste script JS Anda di sini
        const btnOpen = document.getElementById('btn_open');
        btnOpen.addEventListener('click', () => {
            document.body.classList.remove('locked');
            document.getElementById('cover').style.display = 'none';
        });
    </script>
</body>
</html>
