<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Link Undangan</title>
    <link href="https://fonts.googleapis.com/css2?family=Playball&display=swap" rel="stylesheet">
    <style>
        body { font-family: sans-serif; background: #fdfaf6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; border-top: 5px solid #5A0000; }
        h2 { font-family: 'Playball', cursive; color: #5A0000; font-size: 30px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; outline-color: #5A0000; }
        button { background: #25D366; color: white; border: none; padding: 15px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; transition: 0.3s; }
        button:hover { background: #128C7E; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="card">
    <h2>Kirim Undangan</h2>
    <p>Ketik nama tamu di bawah ini:</p>
    
    <input type="text" id="namaTamu" placeholder="Contoh: Pandhu / Nama Tamu">
    
    <button onclick="kirimWA()">Kirim via WhatsApp</button>
</div>

<script>
    function kirimWA() {
        const nama = document.getElementById('namaTamu').value;
        if (!nama) { alert("Isi nama tamu dulu!"); return; }

        // MENGAMBIL URL UTAMA OTOMATIS
        // Bagian ini mendeteksi link website Anda agar link undangannya benar
        const currentUrl = window.location.href;
        const baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf("/") + 1);
        const linkUndangan = baseUrl + "?to=" + encodeURIComponent(nama);

        // FORMAT PESAN PERSIS SESUAI PERMINTAAN ANDA
        const teks = 
            "Kepada Yth.%0A" +
            "Bapak/Ibu/Saudara/i%0A" +
            "*" + nama + "*%0A" + 
            "_______%0A%0A" +
            "Assalamualaikum Warahmatullahi Wabarakatuh%0A%0A" +
            "Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i, teman sekaligus sahabat, untuk menghadiri acara pernikahan kami.%0A%0A" +
            linkUndangan + "%0A" +
            "NB: Hasil maksimal buka lewat browser chrome/safari%0A%0A" +
            "Merupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan untuk hadir dan memberikan doa restu.%0A%0A" +
            "Wassalamualaikum Warahmatullahi Wabarakatuh%0A%0A" +
            "Terima Kasih%0A%0A" +
            "Hormat kami,%0A" +
            "Latif & Erna %0A" + // GANTI NAMA MEMPELAI DI SINI
            "________%0A%0A" +
            "Mohon maaf jika ada kesalahan penulisan nama atau gelar";

        // Membuka WhatsApp
        window.open("https://api.whatsapp.com/send?text=" + teks, '_blank');
    }
</script>

</body>
</html>
