<div class="container" style="margin-top: 50px;">
    <h2>Generator Link Undangan</h2>
    <input type="text" id="nameInput" placeholder="Masukkan Nama Tamu..." 
           style="padding: 10px; width: 80%; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 10px;">
    <br>
    
    <button onclick="sendWhatsApp()" 
            style="padding: 12px 25px; background-color: #25d366; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
        <i class="fab fa-whatsapp"></i> Kirim ke WhatsApp
    </button>
    
    <p id="resultLink" style="margin-top: 20px; font-size: 14px; color: #666;"></p>
</div>

<script>
function sendWhatsApp() {
    const name = document.getElementById('nameInput').value;
    if (name === "") {
        alert("Silakan masukkan nama tamu terlebih dahulu!");
        return;
    }

    // 1. Buat link undangan (Sesuaikan dengan nama folder Anda)
    const baseUrl = "https://www.bernaunginv.my.id/latif-erna/";
    const encodedName = encodeURIComponent(name);
    const finalLink = baseUrl + "?to=" + encodedName;

    // 2. Buat pesan WhatsApp
    const message = "Halo, kami mengundang Anda di acara pernikahan kami. Berikut link undangannya: " + finalLink;
    const whatsappUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(message);

    // 3. Eksekusi buka WhatsApp
    window.open(whatsappUrl, '_blank');
}
</script>
