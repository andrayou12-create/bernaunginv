<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan - Difa & Ridwan</title>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
        }
        /* Pembungkus Layar HP */
        .phone-container {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            border: 2px solid #000;
            position: relative;
            padding: 40px 20px;
            background: #fff;
        }
        /* Aksen Pita/Bunga di Sudut-Sudut (Sesuai Video) */
        .corner-decor {
            position: absolute;
            width: 40px;
            height: 40px;
        }
        .top-left { top: 15px; left: 15px; border-top: 2px solid #000; border-left: 2px solid #000; }
        .top-right { top: 15px; right: 15px; border-top: 2px solid #000; border-right: 2px solid #000; }
        .bottom-left { bottom: 15px; left: 15px; border-bottom: 2px solid #000; border-left: 2px solid #000; }
        .bottom-right { bottom: 15px; right: 15px; border-bottom: 2px solid #000; border-right: 2px solid #000; }

        /* Gaya Teks Tangan */
        .handwritten {
            font-family: 'Architects Daughter', cursive;
            text-align: center;
        }

        /* Bagian Cover (Section 1) */
        .cover-section {
            text-align: center;
            padding: 40px 0;
        }
        .save-the-date {
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        /* Ilustrasi Hati Besar Tengah */
        .heart-illustration {
            width: 220px;
            height: 220px;
            margin: 0 auto 30px;
            border: 2px solid #000;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; /* Sketsa kasor agak abstrak */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }
        .nama-mempelai {
            font-size: 28px;
            margin-top: 20px;
        }

        /* Tombol Buka Undangan */
        .btn-open {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 40px;
            border: 2px solid #000;
            border-radius: 20px;
            background: transparent;
            font-family: 'Architects Daughter', cursive;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            color: #000;
            transition: 0.2s;
        }
        .btn-open:hover {
            background: #000;
            color: #fff;
        }

        /* Pembatas Garis Putus-putus Khas Sketsa */
        .divider {
            border: none;
            border-top: 2px dashed #000;
            margin: 40px 0;
        }

        /* Bagian Detail Acara */
        .wedding-details {
            text-align: center;
        }
        .detail-title {
            font-size: 22px;
            margin-bottom: 20px;
        }
        .detail-box {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            font-size: 14px;
        }
        .detail-item {
            flex: 1;
            padding: 10px;
        }
        .vertical-line {
            border-left: 2px solid #000;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="corner-decor top-left"></div>
        <div class="corner-decor top-right"></div>
        <div class="corner-decor bottom-left"></div>
        <div class="corner-decor bottom-right"></div>

        <section class="cover-section">
            <h1 class="handwritten save-the-date">SAVE THE DATE</h1>
            
            <div class="heart-illustration handwritten">
                <div>08</div>
                <div>12</div>
                <div>25</div>
            </div>

            <h2 class="handwritten nama-mempelai">Difa & Ridwan</h2>
            
            <a href="#content" class="btn-open">Open</a>
        </section>

        <hr class="divider">

        <section id="content" class="wedding-details">
            <h3 class="handwritten detail-title">Wedding Details</h3>
            
            <div class="detail-box">
                <div class="detail-item">
                    <p style="font-weight: bold;">Akad</p>
                    <p>08.00 - Selesai</p>
                    <p>TelorIndo Hall</p>
                    <p>Sawangan Depok</p>
                </div>
                
                <div class="vertical-line"></div>
                
                <div class="detail-item">
                    <p style="font-weight: bold;">Resepsi</p>
                    <p>11.00 - 16.00</p>
                    <p>TelorIndo Hall</p>
                    <p>Sawangan Depok</p>
                </div>
            </div>
        </section>
    </div>

</body>
</html>
