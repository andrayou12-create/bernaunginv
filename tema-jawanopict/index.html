	<script>
    document.addEventListener("DOMContentLoaded", function () {
        // 1. Ambil nama tamu dari link otomatis (?to=Nama+Tamu)
        const urlParams = new URLSearchParams(window.location.search);
        let namaTamu = urlParams.get('to');
        if (namaTamu) {
            namaTamu = decodeURIComponent(namaTamu);
            // Mencari target ID nama tamu atau class bawaan Elementor
            const elemenNama = document.getElementById('nama-tamu') || 
                               document.querySelector('.guest-name') || 
                               document.querySelector('.buka-nama');
            if (elemenNama) { 
                elemenNama.innerText = namaTamu; 
            }
        }

        // 2. Kontrol Musik Otomatis ketika Tombol Buka Undangan Diklik
        const btnOpen = document.getElementById('btn_open') || document.querySelector('.elementor-button-link');
        const audio = document.getElementById('audio');
        if (btnOpen && audio) {
            btnOpen.addEventListener('click', function(e) {
                audio.play().then(() => {
                    console.log("Musik sukses berputar.");
                }).catch(function(error) {
                    console.log("Pemutaran musik ditahan kebijakan browser.");
                });
            });
        }
    });
    </script>
